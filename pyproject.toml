[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixa"
version = "0.0.1"
description = "Convert images to dot-style wallpapers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
pixa = "pixa:main"

[tool.setuptools]
py-modules = ["pixa"]
