[project]
name = "pixa"
version = "1.0.0"
description = "Convert images to dot-style wallpapers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
pixa = "pixa:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
